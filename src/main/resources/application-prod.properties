# ===================================================================
# Production Spring Profile (application-prod.properties)
# Activated when SPRING_PROFILES_ACTIVE=prod
# DO NOT COMMIT SECRETS HERE. All values are read from Render environment variables.
# ===================================================================

spring.application.name=warehouse-backend

# Database Configuration (Mandatory via Environment Variables on Render)
# External providers (Aiven, TiDB Cloud, etc.) require SSL (sslMode=REQUIRED) and UTC timezone
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Hibernate / JPA Strategy
# ========================================================================================
# WARNING / RISK NOTICE:
# - 'update' automatically mutates existing database schema when JPA entities change.
#   Convenient for early deployments, but carries risk of table locks or accidental schema changes.
# - 'validate' only validates that tables and columns match entity definitions and will FAIL to
#   start if discrepancies exist. 'validate' is the industry safest choice when using migrations.
#
# Defaults to 'update' so initial deployment works smoothly, but can be overridden with JPA_DDL_AUTO=validate.
# ========================================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Port dynamically allocated by Render
server.port=${PORT:8080}

# Allowed CORS Origins (set to your Render / Vercel frontend URL in Render dashboard)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT Secret injected via Render Environment Variables
jwt.secret=${JWT_SECRET}

# Logging in production
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.Telangana.Warehouse=INFO
