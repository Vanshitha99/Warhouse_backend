# ===================================================================
# Production Spring Profile (application-prod.properties)
# Activated when SPRING_PROFILES_ACTIVE=prod
# DO NOT COMMIT SECRETS HERE. All values are read from Render environment variables.
# ===================================================================

spring.application.name=warehouse-backend

# Database Configuration (Mandatory via Environment Variables on Render)
# External providers (Aiven, TiDB Cloud, etc.) require SSL (sslMode=REQUIRED) and UTC timezone.
# Supports either a complete JDBC URL (SPRING_DATASOURCE_URL / DB_URL) or individual host/port/name settings.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tgswc_warehouse}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Hibernate / JPA Strategy
# 'update' creates/updates tables automatically in external MySQL without manual migrations.
# Can be changed to 'validate' via JPA_DDL_AUTO once stable.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Port dynamically allocated by Render
server.port=${PORT:8080}

# Allowed CORS Origins (safe default included, override via CORS_ALLOWED_ORIGINS in Render)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tgswc-warehouse-frontend.onrender.com,http://localhost:5173}

# JWT Secret and Expiration (Secret is mandatory from env var, expiration defaults to 24h)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging in production
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.Telangana.Warehouse=INFO
