spring.application.name=warehouse-backend

# Active Spring Profile (default for local, prod for Render)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database Configuration with Environment Variables and Local Defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tgswc_warehouse}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server Port (Render sets $PORT dynamically)
server.port=${PORT:8080}

# Allowed CORS Origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# JWT Secret Key and Expiration (milliseconds, default 24h = 86400000)
jwt.secret=${JWT_SECRET:TelanganaWarehouseManagementSystemSecretKey2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.org.springframework.security=DEBUG
